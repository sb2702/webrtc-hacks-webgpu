<text x="36" y="470" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">re-checks every slot on every draw (and may recompile)</text>
<rect x="568" y="16" width="536" height="468" rx="14" fill="#f5f4f0" stroke="none" stroke-width="1.5"/>
<text x="588" y="52" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="700" fill="#2a78d6" text-anchor="start">WebGPU</text>
<text x="702" y="52" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">sealed objects + a command list</text>
<text x="588" y="92" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">built once, at setup</text>
<rect x="588" y="104" width="220" height="136" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
