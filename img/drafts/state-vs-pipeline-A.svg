<text x="48" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">gl.enable(gl.BLEND)</text>
<rect x="300" y="88" width="232" height="290" rx="10" fill="#ffffff" stroke="#eb6834" stroke-width="2"/>
<text x="416" y="114" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600" fill="#eb6834" text-anchor="middle">the context</text>
<text x="314" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">ARRAY_BUFFER</text>
<rect x="440" y="132" width="80" height="26" rx="13" fill="#f5f4f0" stroke="#c9c7be" stroke-width="1.5"/>
