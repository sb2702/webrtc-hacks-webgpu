<text x="602" y="154" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">shader: blur</text>
<text x="602" y="175" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">vertex layout</text>
<text x="602" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">blend: on</text>
<text x="602" y="217" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">target: canvas format</text>
<rect x="588" y="260" width="220" height="112" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
