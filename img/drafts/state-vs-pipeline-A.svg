<text x="124" y="52" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">one global state machine</text>
<text x="36" y="92" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">your calls, in order</text>
