<text x="48" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">gl.bindBuffer(…, verts)</text>
<rect x="36" y="172" width="210" height="34" rx="6" fill="#ffffff" stroke="#c9c7be" stroke-width="1.5"/>
<text x="48" y="194" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">gl.bindTexture(…, photo)</text>
<rect x="36" y="216" width="210" height="34" rx="6" fill="#ffffff" stroke="#c9c7be" stroke-width="1.5"/>
