<text x="314" y="354" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start" font-style="italic">(left over from earlier code)</text>
<rect x="36" y="392" width="210" height="34" rx="6" fill="#ffffff" stroke="#eb6834" stroke-width="2"/>
<text x="48" y="414" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">gl.drawArrays(…)</text>
<path d="M246,409 L416,409 L416,382" fill="none" stroke="#eb6834" stroke-width="1.8" marker-end="url(#agl)"/>
