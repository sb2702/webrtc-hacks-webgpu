<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Background replacement demo</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; background: #111; color: #eee; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin-bottom: 12px; }
  label { display: flex; gap: 6px; align-items: center; }
  #output { max-width: 100%; max-height: 75vh; background: #000; display: block; }
  #stats { font: 13px ui-monospace, monospace; color: #9f9; min-height: 1.4em; margin-bottom: 8px; }
  #source { display: none; }
</style>

<div class="controls">
  <label>Pipeline <select id="pipeline"></select></label>
  <button id="camera">Use camera</button>
  <button id="sample">Use sample video</button>
  <label>Video file <input type="file" id="videoFile" accept="video/*"></label>
  <label>Color <input type="color" id="color" value="#00b140"></label>
</div>
<div id="stats">Pick a source.</div>
<video id="output" autoplay muted playsinline></video>
<video id="source" muted playsinline loop></video>

<script type="module">
  import { VideoProcessStream } from 'webcodecs-utils'
  import { PIPELINES } from './src/pipelines.js'

  // The WebRTC-shaped path: MediaStreamTrack -> MediaStreamTrackProcessor
  // (VideoFrames) -> pipeline.process() -> MediaStreamTrackGenerator -> a
  // MediaStreamTrack you could hand to an RTCPeerConnection.
  // (Both are Chromium main-thread APIs; elsewhere this would run in a worker
  // with VideoTrackGenerator.)

  const $ = (id) => document.getElementById(id)
  for (const [name, { label }] of Object.entries(PIPELINES)) $('pipeline').add(new Option(label, name))
  $('pipeline').value = 'webgpu'

  let pipeline = null, color = [0, 177 / 255, 64 / 255]
  async function selectPipeline(name) {
    const next = await PIPELINES[name].create()
    next.frames?.setColor(color)
    const prev = pipeline
    pipeline = next
    prev?.destroy?.()
  }

  const stats = { frames: 0, ms: 0, last: performance.now() }
  function report(ms) {
    stats.frames++
    stats.ms += ms
    const now = performance.now()
    if (now - stats.last > 1000) {
      $('stats').textContent = `${$('pipeline').selectedOptions[0].text}  ${(stats.frames * 1000 / (now - stats.last)).toFixed(1)} fps  ` +
        `process() ${(stats.ms / stats.frames).toFixed(2)} ms`
      Object.assign(stats, { frames: 0, ms: 0, last: now })
    }
  }

  let currentTrack = null
  async function start(track) {
    currentTrack?.stop()
    currentTrack = track
    if (!pipeline) await selectPipeline($('pipeline').value)
    const processor = new MediaStreamTrackProcessor({ track })
    const generator = new MediaStreamTrackGenerator({ kind: 'video' })
    processor.readable
      .pipeThrough(new VideoProcessStream(async (frame) => {
        const t = performance.now()
        const out = await pipeline.process(frame)
        report(performance.now() - t)
        return out
      }))
      .pipeTo(generator.writable)
      .catch(() => {})   // track stopped
    $('output').srcObject = new MediaStream([generator])
  }

  async function playFile(src) {
    const video = $('source')
    video.src = src
    await video.play()
    start(video.captureStream().getVideoTracks()[0])
  }

  $('camera').onclick = async () => {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } })
    start(stream.getVideoTracks()[0])
  }
  $('sample').onclick = () => playFile('/media/woman_on_video_call.mp4')
  $('videoFile').onchange = (e) => e.target.files[0] && playFile(URL.createObjectURL(e.target.files[0]))
  $('pipeline').onchange = (e) => selectPipeline(e.target.value)
  $('color').oninput = (e) => {
    const hex = e.target.value
    color = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255)
    pipeline?.frames?.setColor(color)
  }

  const params = new URLSearchParams(location.search)
  if (params.get('pipeline')) $('pipeline').value = params.get('pipeline')
  if (params.has('sample')) $('sample').click()
</script>
