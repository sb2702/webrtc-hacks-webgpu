<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 422" width="820" height="422" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Selfie segmentation throughput, 360p transcode, Apple M4</title>
